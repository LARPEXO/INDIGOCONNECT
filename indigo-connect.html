<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indigo Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#0c0a16;
    --bg-glow-a:#2a1f5c;
    --bg-glow-b:#120e26;
    --app-bg:#15111f;
    --surface:#1d1830;
    --surface-alt:#261f42;
    --divider: rgba(255,255,255,0.07);
    --accent:#7c6ff2;
    --accent-soft:#b7adff;
    --accent-dim: rgba(124,111,242,0.16);
    --text-primary:#f1eefb;
    --text-muted:#978fbe;
    --text-faint:#645d85;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 15%, var(--bg-glow-a), transparent 55%),
      radial-gradient(circle at 80% 90%, var(--bg-glow-b), transparent 60%),
      var(--bg-page);
    font-family:'Inter', sans-serif;
    padding:32px 16px;
  }

  .frame{
    width:100%;
    max-width:400px;
    height:min(820px, 92vh);
    background:var(--app-bg);
    border-radius:32px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 18px;
    border-bottom:1px solid var(--divider);
    flex-shrink:0;
  }

  .logo-mark{
    width:36px; height:36px;
    flex-shrink:0;
  }

  .wordmark{
    display:flex;
    flex-direction:column;
    line-height:1.15;
  }

  .wordmark .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    color:var(--text-primary);
    letter-spacing:0.2px;
  }

  .wordmark .tagline{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:1px;
  }

  /* ---------- Content ---------- */
  .content{
    flex:1;
    overflow:hidden;
    padding:20px 20px 20px;
    display:flex;
    flex-direction:column;
  }

  .panel{ display:none; animation: rise 0.35s ease; flex-direction:column; flex:1; min-height:0; }
  .panel.active{ display:flex; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .panel-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--text-primary);
    margin:0;
  }

  .panel-sub{
    font-size:12px;
    color:var(--text-muted);
    margin:1px 0 0;
  }

  .panel-head{
    display:flex;
    flex-direction:column;
    margin-bottom:14px;
    flex-shrink:0;
  }

  /* ---------- Empty state ---------- */
  .launch-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:52px 12px 8px;
  }

  .launch-icon{
    width:72px; height:72px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  .launch-card h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:17px;
    color:var(--text-primary);
    margin:0 0 8px;
    font-weight:600;
  }

  .launch-card p{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 26px;
    max-width:250px;
    line-height:1.5;
  }

  .connect-btn{
    background:var(--accent);
    color:#100c1e;
    border:none;
    padding:13px 26px;
    border-radius:999px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .connect-btn:hover{ background:var(--accent-soft); }
  .connect-btn:active{ transform:scale(0.97); }

  .launch-url{
    margin-top:14px;
    font-size:11.5px;
    color:var(--text-faint);
  }

  /* ---------- Embedded view ---------- */
  .embed-wrap{
    position:relative;
    width:100%;
    height:100%;
    border-radius:var(--radius-md);
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--divider);
  }

  .embed-wrap iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }

  .embed-fallback{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
    background:var(--surface);
  }

  .embed-fallback p{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0 0 18px;
    max-width:230px;
    line-height:1.5;
  }

  .open-external{
    position:absolute;
    top:10px; right:10px;
    background:rgba(12,10,22,0.7);
    color:var(--text-primary);
    border:1px solid rgba(255,255,255,0.12);
    padding:6px 12px;
    border-radius:999px;
    font-size:11px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    z-index:2;
  }


  /* ---------- Discord list ---------- */
  .feed{ display:none; flex-direction:column; gap:10px; }
  .feed.active{ display:flex; }

  .row-card{
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:var(--radius-md);
    padding:12px 14px;
  }

  .avatar{
    width:42px; height:42px;
    border-radius:13px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    color:#100c1e;
  }

  .row-main{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .row-name{ font-size:14px; font-weight:600; color:var(--text-primary); }
  .row-time{ font-size:11px; color:var(--text-faint); flex-shrink:0; }
  .row-msg{
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .unread{
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:999px;
    background:var(--accent);
    color:#100c1e;
    font-size:10.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .section-label{
    font-size:11px;
    color:var(--text-faint);
    margin:18px 0 10px;
    font-weight:500;
  }
  .section-label:first-child{ margin-top:0; }

  /* ---------- YouTube feed ---------- */
  .video-card{
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:var(--radius-md);
    overflow:hidden;
    margin-bottom:14px;
  }

  .thumb{
    height:150px;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
  }

  .thumb .duration{
    background:rgba(0,0,0,0.65);
    color:#fff;
    font-size:11px;
    padding:2px 6px;
    border-radius:5px;
    margin:0 8px 8px 0;
  }

  .play-glyph{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .video-info{
    display:flex;
    gap:11px;
    padding:12px 13px 14px;
  }

  .channel-dot{
    width:34px; height:34px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    color:#100c1e;
  }

  .video-title{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-primary);
    line-height:1.35;
    margin:0 0 4px;
  }

  .video-meta{
    font-size:11.5px;
    color:var(--text-muted);
  }

  /* ---------- Bottom nav ---------- */
  nav{
    display:flex;
    border-top:1px solid var(--divider);
    background:var(--app-bg);
    flex-shrink:0;
    padding:8px 14px calc(14px + env(safe-area-inset-bottom));
    gap:8px;
  }

  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:9px 4px;
    border-radius:16px;
    cursor:pointer;
    background:transparent;
    border:none;
    font-family:'Inter', sans-serif;
    transition: background 0.18s ease;
  }

  .tab.active{ background:var(--accent-dim); }

  .tab svg{ width:22px; height:22px; }
  .tab .tab-icon-stroke{ stroke:var(--text-faint); transition: stroke 0.18s ease; }
  .tab.active .tab-icon-stroke{ stroke:var(--accent-soft); }
  .tab .tab-icon-fill{ fill:var(--text-faint); transition: fill 0.18s ease; }
  .tab.active .tab-icon-fill{ fill:var(--accent-soft); }

  .tab-label{
    font-size:11px;
    font-weight:500;
    color:var(--text-faint);
  }
  .tab.active .tab-label{ color:var(--accent-soft); }

</style>
</head>
<body>

<div class="frame">

  <header>
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8f7dff"/>
          <stop offset="1" stop-color="#4d3fc9"/>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="34" height="34" rx="11" fill="url(#logoGrad)"/>
      <circle cx="16" cy="20" r="6" fill="#0c0a16" fill-opacity="0.85"/>
      <circle cx="25" cy="20" r="6" fill="#f1eefb"/>
    </svg>
    <div class="wordmark">
      <span class="name">Indigo Connect</span>
      <span class="tagline">Your circles, one screen</span>
    </div>
  </header>

  <div class="content">

    <!-- DISCORD PANEL -->
    <section class="panel active" id="panel-discord">
      <div class="panel-head">
        <h2 class="panel-title">Discord</h2>
        <p class="panel-sub">discord.com, shown in-app</p>
      </div>
      <div class="embed-wrap">
        <button class="open-external" onclick="window.open('https://discord.com/app','_blank')">Open in new tab ↗</button>
        <iframe src="https://discord.com/app" title="Discord" allow="clipboard-write; microphone; camera"></iframe>
      </div>
    </section>

    <!-- YOUTUBE PANEL -->
    <section class="panel" id="panel-youtube">
      <div class="panel-head">
        <h2 class="panel-title">YouTube</h2>
        <p class="panel-sub">youtube.com, shown in-app</p>
      </div>
      <div class="embed-wrap">
        <button class="open-external" onclick="window.open('https://youtube.com','_blank')">Open in new tab ↗</button>
        <iframe src="https://www.youtube.com" title="YouTube" allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
    </section>

    <!-- GAME PANEL -->
    <section class="panel" id="panel-game">
      <div class="panel-head">
        <h2 class="panel-title">Game</h2>
        <p class="panel-sub">geofs.com, shown in-app</p>
      </div>
      <div class="embed-wrap">
        <button class="open-external" onclick="window.open('https://www.geo-fs.com/geofs.php','_blank')">Open in new tab ↗</button>
        <iframe src="https://www.geo-fs.com/geofs.php" title="GeoFS" allow="fullscreen"></iframe>
      </div>
    </section>

  </div>

  <nav>
    <button class="tab active" id="tab-discord" onclick="showPanel('discord')">
      <svg viewBox="0 0 24 24" fill="none">
        <path class="tab-icon-stroke" d="M4 17V8.5C4 6.6 5.6 5 7.5 5h9C18.4 5 20 6.6 20 8.5V17l-3-2H8l-4 2Z" stroke-width="1.7" stroke-linejoin="round"/>
        <circle class="tab-icon-fill" cx="9.5" cy="11" r="1.15"/>
        <circle class="tab-icon-fill" cx="14.5" cy="11" r="1.15"/>
      </svg>
      <span class="tab-label">Discord</span>
    </button>
    <button class="tab" id="tab-youtube" onclick="showPanel('youtube')">
      <svg viewBox="0 0 24 24" fill="none">
        <rect class="tab-icon-stroke" x="3.5" y="6" width="17" height="12" rx="4" stroke-width="1.7"/>
        <polygon class="tab-icon-fill" points="10.5,9.3 15,12 10.5,14.7"/>
      </svg>
      <span class="tab-label">YouTube</span>
    </button>
    <button class="tab" id="tab-game" onclick="showPanel('game')">
      <svg viewBox="0 0 24 24" fill="none">
        <path class="tab-icon-stroke" d="M2 16.5l7-2 3.5-7.5c.3-.6 1.2-.6 1.5 0l1 2 4-1c.6-.15 1.1.4 .9 1l-1.4 3.7 3.5 2.3c.5.35.35 1.1-.25 1.25l-4.2 1.05-.6 3.4c-.1.6-.9.8-1.3.3l-2.1-2.7-6.6 2.4c-.6.2-1.1-.4-.85-1l1.35-3.1-5.45-.65Z" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span class="tab-label">Game</span>
    </button>
  </nav>

</div>

<script>
  function showPanel(name){
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }
</script>

</body>
</html>
